[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hqg-datafeed"
version = "0.1.0"
description = "Stateless market and alternative data fetching library for HQG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "python-dotenv",
    "requests",
    "yfinance",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["datafeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
